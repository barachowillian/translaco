<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>TransLaço - Cadastro</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>

<h1>TRANSLAÇO</h1>

<div class="container">
    <div class="box">
        <h2>Cadastro</h2>

        <form method="POST" action="#" enctype="multipart/form-data">

            <input type="text" name="nome_social" placeholder="Nome social" required>

            <input type="text" name="nome_civil" placeholder="Nome civil (opcional)">

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="senha" placeholder="Senha" required>

            <select name="area_interesse" required>
                <option value="">Área de interesse</option>

                <option>Administração</option>
                <option>Arquitetura e Urbanismo</option>
                <option>Artes</option>
                <option>Comunicação</option>
                <option>Contabilidade</option>
                <option>Design</option>
                <option>Direito</option>
                <option>Educação</option>
                <option>Engenharia</option>
                <option>Finanças</option>
                <option>Gastronomia</option>
                <option>Gestão de Pessoas</option>
                <option>Marketing</option>
                <option>Meio Ambiente</option>
                <option>Recursos Humanos</option>
                <option>Saúde</option>
                <option>Serviços</option>
                <option>Tecnologia</option>
                <option>Turismo</option>
                <option>Outra</option>
            </select>

            <label for="curriculo">Currículo (PDF)</label>
            <input 
                type="file" 
                id="curriculo" 
                name="curriculo" 
                accept=".pdf"
            >

            <button type="submit">Cadastrar</button>

        </form>

        <a href="./login.html">Voltar para login</a>
    </div>
</div>

</body>
</html>
