
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransLaço - Cadastro</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<h1>TRANSLAÇO</h1>

<div class="container">
    <div class="box">
        <h2>Cadastro</h2>

        <form id="formCadastro">

            <input type="text" id="nome_social"
                placeholder="Nome social" required>

            <input type="text" id="nome_civil"
                placeholder="Nome civil (opcional)">

            <input type="email" id="email"
                placeholder="Email" required>

            <input type="password" id="senha"
                placeholder="Senha" required minlength="6">

            <select id="area_interesse" required>
                <option value="">Área de interesse</option>
                <option>Administração</option>
                <option>Arquitetura e Urbanismo</option>
                <option>Artes</option>
                <option>Comunicação</option>
                <option>Contabilidade</option>
                <option>Design</option>
                <option>Direito</option>
                <option>Educação</option>
                <option>Engenharia</option>
                <option>Finanças</option>
                <option>Gastronomia</option>
                <option>Gestão de Pessoas</option>
                <option>Marketing</option>
                <option>Meio Ambiente</option>
                <option>Recursos Humanos</option>
                <option>Saúde</option>
                <option>Serviços</option>
                <option>Tecnologia</option>
                <option>Turismo</option>
                <option>Outra</option>
            </select>

            <label for="curriculo">Currículo (PDF)</label>
            <input type="file" id="curriculo"
                accept=".pdf,application/pdf">

            <button type="submit">Cadastrar</button>

        </form>

        <p id="mensagemCadastro"></p>

        <a href="login.html">Voltar para login</a>
    </div>
</div>

<script src="cadastro.js"></script>

</body>
</html>
